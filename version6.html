<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Indien Boutique V6</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{font-family:Arial,sans-serif;margin:0;padding:16px;background:#f3f3f3}
h1{text-align:center;font-size:25px}
h2{margin-top:5px}
.box{background:white;padding:16px;border-radius:12px;margin-bottom:15px}

input{
 width:100%;box-sizing:border-box;padding:13px;
 margin:6px 0;font-size:17px
}

button{
 padding:13px;margin:5px 2px;font-size:16px;
 border:0;border-radius:8px
}

.creer{background:#1769aa;color:white}
.entree{background:#1f9d55;color:white}
.sortie{background:#d64545;color:white}
.scan{background:#7048c8;color:white;width:100%;font-size:19px}
.stop{background:#555;color:white;width:100%}
.export{background:#333;color:white}
.effacer{background:#777;color:white}

.mode{display:flex;gap:8px;margin:10px 0}
.mode button{flex:1}
.modeActif{outline:4px solid #111;font-weight:bold}

#modeTexte{
 text-align:center;font-size:19px;font-weight:bold;
 padding:10px;border-radius:8px;background:#e8f5e9
}

#reader{
 display:none;width:100%;margin:10px 0;
 overflow:hidden;border-radius:12px
}

#reader video{
 width:100%!important;
 height:auto!important;
 object-fit:cover
}

#apercuPhoto{
 display:none;width:120px;max-height:120px;
 object-fit:contain;margin:10px auto;border-radius:8px
}

.tailles{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}

.tailles label{
 background:#eee;padding:10px;border-radius:8px;font-weight:bold
}

.tailles input{width:auto}

.etiquette{
 background:white;border:1px solid #bbb;
 margin:10px 0;padding:8px;text-align:center
}

.etiquette img{width:70px;height:70px;object-fit:contain}
.etiquette svg{max-width:100%}

table{width:100%;border-collapse:collapse;background:white}

th,td{
 padding:8px 3px;border-bottom:1px solid #ddd;
 text-align:left;font-size:14px
}

.stock{font-weight:bold;font-size:17px}

#messageScan{
 font-weight:bold;text-align:center;
 margin:10px;font-size:18px;min-height:25px
}
</style>
</head>

<body>

<h1>📦 Stock Indien Boutique V6</h1>

<div class="box">

<h2>📸 Créer un produit</h2>

<input id="photo" type="file" accept="image/*"
capture="environment" onchange="chargerPhoto(event)">

<img id="apercuPhoto">

<input id="nouveauNom" placeholder="Nom du produit">
<input id="reference" placeholder="Référence (ex : 607848-BC)">
<input id="couleur" placeholder="Couleur (facultatif)">

<p><b>Tailles disponibles :</b></p>

<div class="tailles">
<label><input type="checkbox" value="XS"> XS</label>
<label><input type="checkbox" value="S"> S</label>
<label><input type="checkbox" value="M"> M</label>
<label><input type="checkbox" value="L"> L</label>
<label><input type="checkbox" value="XL"> XL</label>
<label><input type="checkbox" value="2XL"> 2XL</label>
<label><input type="checkbox" value="3XL"> 3XL</label>
<label><input type="checkbox" value="4XL"> 4XL</label>
<label><input type="checkbox" value="5XL"> 5XL</label>
</div>

<button class="creer" onclick="creerProduit()">
Créer les codes-barres
</button>

<div id="etiquettes"></div>

</div>


<div class="box">

<h2>📲 Scanner le stock</h2>

<div class="mode">

<button id="btnEntree"
class="entree modeActif"
onclick="choisirMode(1)">
📥 ENTRÉE
</button>

<button id="btnVente"
class="sortie"
onclick="choisirMode(-1)">
🛒 VENTE
</button>

</div>

<div id="modeTexte">MODE : ENTRÉE (+1)</div>

<button class="scan" onclick="demarrerScanner()">
📷 OUVRIR CAMÉRA ARRIÈRE
</button>

<button class="stop" onclick="arreterScanner()">
⏹ FERMER LE SCANNER
</button>

<div id="reader"></div>

<div id="messageScan">
Présente le code-barres devant la caméra
</div>

<input id="code"
placeholder="Scanner ou saisir le code-barres"
autocapitalize="characters">

<input id="nom" placeholder="Nom du produit">
<input id="taille" placeholder="Taille">

<button class="entree" onclick="mouvement(1)">
+ ENTRÉE MANUELLE
</button>

<button class="sortie" onclick="mouvement(-1)">
− VENTE MANUELLE
</button>

</div>


<div class="box">

<input id="recherche"
placeholder="🔎 Rechercher produit, taille ou code..."
oninput="afficher()">

<button class="export" onclick="exportCSV()">
Exporter CSV
</button>

<button class="effacer" onclick="toutEffacer()">
Effacer le stock
</button>

</div>


<table>
<thead>
<tr>
<th>Code</th>
<th>Produit</th>
<th>Taille</th>
<th>Stock</th>
</tr>
</thead>

<tbody id="liste"></tbody>
</table>


<script>

let stock=JSON.parse(
 localStorage.getItem("stockIndienV6") ||
 localStorage.getItem("stockIndienV5") ||
 localStorage.getItem("stockIndienV4") ||
 localStorage.getItem("stockIndienV3") ||
 "{}"
);

let photoProduit="";
let scanner=null;
let modeScan=1;

/* Sécurité V6 */
let dernierCode="";
let nombreLectures=0;
let codeEnCours=false;


/* PHOTO */

function chargerPhoto(event){

 const fichier=event.target.files[0];
 if(!fichier)return;

 const lecteur=new FileReader();

 lecteur.onload=function(e){

   photoProduit=e.target.result;

   const img=document.getElementById("apercuPhoto");

   img.src=photoProduit;
   img.style.display="block";
 };

 lecteur.readAsDataURL(fichier);
}


/* NETTOYAGE CODE */

function nettoyerCode(texte){

 return texte.trim().toUpperCase()
 .replace(/\s+/g,"-")
 .replace(/[^A-Z0-9\-]/g,"");
}


/* CREATION PRODUIT */

function creerProduit(){

 const nom=document.getElementById("nouveauNom").value.trim();

 let reference=nettoyerCode(
   document.getElementById("reference").value
 );

 const couleur=document.getElementById("couleur").value.trim();

 if(!nom){
   alert("Indiquez le nom du produit.");
   return;
 }

 if(!reference){

   reference="IB-"+Date.now().toString().slice(-8);

   document.getElementById("reference").value=reference;
 }

 const tailles=[...document.querySelectorAll(
   ".tailles input:checked"
 )].map(x=>x.value);

 if(!tailles.length){

   alert("Sélectionnez au moins une taille.");
   return;
 }

 const zone=document.getElementById("etiquettes");

 zone.innerHTML="";

 tailles.forEach((taille,index)=>{

   const code=reference+"-"+taille;

   if(!stock[code]){

     stock[code]={
       nom:nom,
       taille:taille,
       couleur:couleur,
       quantite:0,
       photo:photoProduit
     };

   }else{

     stock[code].nom=nom;
     stock[code].taille=taille;
     stock[code].couleur=couleur;

     if(photoProduit)
       stock[code].photo=photoProduit;
   }

   const div=document.createElement("div");

   div.className="etiquette";

   div.innerHTML=
     (photoProduit ?
       '<img src="'+photoProduit+'"><br>' : '')+
     "<b>"+nom+"</b><br>"+
     (couleur ? couleur+" · " : "")+
     "<b>"+taille+"</b><br>"+
     '<svg id="bar'+index+'"></svg>'+
     "<br><small>"+code+"</small>";

   zone.appendChild(div);

   setTimeout(()=>{

     JsBarcode("#bar"+index,code,{
       format:"CODE128",
       displayValue:false,
       height:45,
       margin:3
     });

   },0);
 });

 sauvegarder();
 afficher();
}


/* SAUVEGARDE */

function sauvegarder(){

 localStorage.setItem(
   "stockIndienV6",
   JSON.stringify(stock)
 );
}


/* MODE */

function choisirMode(mode){

 modeScan=mode;

 const entree=document.getElementById("btnEntree");
 const vente=document.getElementById("btnVente");
 const texte=document.getElementById("modeTexte");

 entree.classList.remove("modeActif");
 vente.classList.remove("modeActif");

 if(mode===1){

   entree.classList.add("modeActif");

   texte.textContent="MODE : ENTRÉE (+1)";
   texte.style.background="#e8f5e9";

 }else{

   vente.classList.add("modeActif");

   texte.textContent="MODE : VENTE (−1)";
   texte.style.background="#ffebee";
 }
}


/* MOUVEMENT */

function mouvement(qte){

 const code=document.getElementById("code")
 .value.trim().toUpperCase();

 const nom=document.getElementById("nom").value.trim();
 const taille=document.getElementById("taille").value.trim();

 if(!code){

   alert("Scannez ou saisissez un code-barres.");
   return;
 }

 if(!stock[code]){

   if(qte<0){

     alert("Produit inconnu.");
     return;
   }

   if(!nom){

     alert("Produit inconnu : indiquez son nom.");
     return;
   }

   stock[code]={
     nom:nom,
     taille:taille,
     couleur:"",
     quantite:0,
     photo:""
   };
 }

 stock[code].quantite+=qte;

 if(stock[code].quantite<0)
   stock[code].quantite=0;

 sauvegarder();
 afficher();

 document.getElementById("messageScan").textContent=
   (qte>0 ? "✅ ENTRÉE : " : "🛒 VENTE : ")+
   stock[code].nom+" · "+
   stock[code].taille+
   " → STOCK : "+
   stock[code].quantite;

 document.getElementById("code").value="";
 document.getElementById("nom").value="";
 document.getElementById("taille").value="";
}


/* =========================
   SCANNER V6
   3 LECTURES IDENTIQUES
========================= */

async function demarrerScanner(){

 const zone=document.getElementById("reader");
 const message=document.getElementById("messageScan");

 zone.style.display="block";
 zone.innerHTML="";

 dernierCode="";
 nombreLectures=0;
 codeEnCours=false;

 try{

   if(scanner){

     try{
       await scanner.stop();
     }catch(e){}
   }

   scanner=new Html5Qrcode("reader");

   const config={

     fps:20,

     qrbox:function(width,height){

       let w=Math.floor(width*0.90);
       let h=120;

       if(w>400)w=400;

       if(h>height*0.5)
         h=Math.floor(height*0.5);

       return{
         width:w,
         height:h
       };
     },

     formatsToSupport:[
       Html5QrcodeSupportedFormats.CODE_128,
       Html5QrcodeSupportedFormats.EAN_13,
       Html5QrcodeSupportedFormats.EAN_8
     ]
   };


   await scanner.start(

     {facingMode:"environment"},

     config,

     function(code){

       if(codeEnCours)return;

       code=code.trim().toUpperCase();


       /* Vérification de cohérence */

       if(code===dernierCode){

         nombreLectures++;

       }else{

         dernierCode=code;
         nombreLectures=1;
       }


       message.textContent=
         "🔍 Vérification du code : "+
         nombreLectures+"/3";


       /* Pas encore confirmé */

       if(nombreLectures<3)
         return;


       /* Code confirmé */

       codeEnCours=true;

       document.getElementById("code").value=code;


       if(stock[code]){

         document.getElementById("nom").value=
           stock[code].nom;

         document.getElementById("taille").value=
           stock[code].taille;


         stock[code].quantite+=modeScan;


         if(stock[code].quantite<0)
           stock[code].quantite=0;


         sauvegarder();
         afficher();


         message.textContent=

           (modeScan===1 ?
             "✅ +1 ENTRÉE — " :
             "🛒 −1 VENTE — ")+

           stock[code].nom+
           " · "+
           stock[code].taille+
           " → STOCK : "+
           stock[code].quantite;


         if(navigator.vibrate)
           navigator.vibrate([100,60,100]);


       }else{

         message.textContent=
           "⚠️ CODE CONFIRMÉ MAIS INCONNU : "+code;
       }


       /*
       Empêche de recompter immédiatement
       le même code encore devant la caméra
       */

       setTimeout(()=>{

         dernierCode="";
         nombreLectures=0;
         codeEnCours=false;

       },1800);

     },

     function(){}
   );


 }catch(err){

   message.textContent=
     "❌ Impossible d'ouvrir la caméra arrière.";

   console.error(err);
 }
}


/* FERMER SCANNER */

async function arreterScanner(){

 if(scanner){

   try{

     await scanner.stop();
     scanner.clear();

   }catch(e){}

   scanner=null;
 }

 dernierCode="";
 nombreLectures=0;
 codeEnCours=false;

 document.getElementById("reader").style.display="none";

 document.getElementById("messageScan").textContent=
   "Scanner fermé.";
}


/* AFFICHAGE */

function afficher(){

 const recherche=document.getElementById("recherche")
 .value.toLowerCase();

 const liste=document.getElementById("liste");

 liste.innerHTML="";

 Object.keys(stock)

 .sort((a,b)=>

   (stock[a].nom||"")
   .localeCompare(stock[b].nom||"")

 )

 .forEach(code=>{

   const p=stock[code];

   const texte=(

     code+" "+
     (p.nom||"")+" "+
     (p.taille||"")

   ).toLowerCase();


   if(!texte.includes(recherche))
     return;


   const tr=document.createElement("tr");


   tr.innerHTML=

     "<td>"+code+"</td>"+
     "<td>"+(p.nom||"")+"</td>"+
     "<td>"+(p.taille||"")+"</td>"+
     "<td class='stock'>"+
     (p.quantite||0)+
     "</td>";


   liste.appendChild(tr);
 });
}


/* EXPORT CSV */

function exportCSV(){

 let csv="Code;Produit;Taille;Stock\n";


 Object.keys(stock).forEach(code=>{

   const p=stock[code];

   csv+=
     code+";"+
     (p.nom||"")+";"+
     (p.taille||"")+";"+
     (p.quantite||0)+
     "\n";
 });


 telecharger(

   "\uFEFF"+csv,

   "stock-indien-V6.csv",

   "text/csv;charset=utf-8"
 );
}


function telecharger(contenu,nom,type){

 const blob=new Blob(
   [contenu],
   {type:type}
 );

 const url=URL.createObjectURL(blob);

 const lien=document.createElement("a");

 lien.href=url;
 lien.download=nom;

 document.body.appendChild(lien);

 lien.click();

 lien.remove();

 setTimeout(
   ()=>URL.revokeObjectURL(url),
   1000
 );
}


/* EFFACER */

function toutEffacer(){

 if(confirm("Effacer tout le stock V6 ?")){

   stock={};

   sauvegarder();
   afficher();
 }
}


/* DOUCHETTE / CLAVIER */

document.getElementById("code")
.addEventListener("keydown",function(e){

 if(e.key==="Enter"){

   e.preventDefault();

   mouvement(modeScan);
 }
});


sauvegarder();
afficher();

</script>

</body>
</html>
