<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Indien Boutique V3</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  padding:16px;
  background:#f3f3f3;
}
h1{text-align:center;font-size:25px}
h2{margin-top:5px}
.box{
  background:white;
  padding:16px;
  border-radius:12px;
  margin-bottom:15px;
}
input{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin:6px 0;
  font-size:17px;
}
button{
  padding:13px;
  margin:5px 2px;
  font-size:16px;
  border:0;
  border-radius:8px;
}
.creer{background:#1769aa;color:white}
.entree{background:#1f9d55;color:white}
.sortie{background:#d64545;color:white}
.scan{background:#7048c8;color:white;width:100%;font-size:19px}
.export{background:#333;color:white}
.catalogue{background:#00695c;color:white}
.effacer{background:#777;color:white}

#apercuPhoto{
  display:none;
  width:120px;
  max-height:120px;
  object-fit:contain;
  margin:10px auto;
  border-radius:8px;
}
#reader{
  display:none;
  width:100%;
  margin:10px 0;
}

.tailles{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:10px 0;
}
.tailles label{
  background:#eee;
  padding:10px;
  border-radius:8px;
  font-weight:bold;
}
.tailles input{width:auto}

.etiquette{
  background:white;
  border:1px solid #bbb;
  margin:10px 0;
  padding:8px;
  text-align:center;
}
.etiquette img{
  width:70px;
  height:70px;
  object-fit:contain;
}
.etiquette svg{max-width:100%}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}
th,td{
  padding:8px 3px;
  border-bottom:1px solid #ddd;
  text-align:left;
  font-size:14px;
}
.stock{
  font-weight:bold;
  font-size:17px;
}
#messageScan{
  font-weight:bold;
  text-align:center;
  margin:8px;
}
</style>
</head>

<body>

<h1>📦 Stock Indien Boutique V3</h1>

<div class="box">
<h2>📸 Créer un produit</h2>

<input id="photo" type="file" accept="image/*"
capture="environment" onchange="chargerPhoto(event)">

<img id="apercuPhoto">

<input id="nouveauNom" placeholder="Nom du produit">
<input id="reference" placeholder="Référence (ex : 607848-BC)">
<input id="couleur" placeholder="Couleur (facultatif)">

<p><b>Tailles disponibles :</b></p>

<div class="tailles">
<label><input type="checkbox" value="XS"> XS</label>
<label><input type="checkbox" value="S"> S</label>
<label><input type="checkbox" value="M"> M</label>
<label><input type="checkbox" value="L"> L</label>
<label><input type="checkbox" value="XL"> XL</label>
<label><input type="checkbox" value="2XL"> 2XL</label>
<label><input type="checkbox" value="3XL"> 3XL</label>
<label><input type="checkbox" value="4XL"> 4XL</label>
<label><input type="checkbox" value="5XL"> 5XL</label>
</div>

<button class="creer" onclick="creerProduit()">
Créer les codes-barres
</button>

<div id="etiquettes"></div>
</div>

<div class="box">
<h2>📲 Stock / Scan</h2>

<button class="scan" onclick="demarrerScanner()">
📷 SCANNER AVEC L'APPAREIL PHOTO
</button>

<div id="reader"></div>
<div id="messageScan"></div>

<input id="code" placeholder="Scanner ou saisir le code-barres"
autocapitalize="characters">

<input id="nom" placeholder="Nom du produit">
<input id="taille" placeholder="Taille">

<button class="entree" onclick="mouvement(1)">
+ ENTRÉE
</button>

<button class="sortie" onclick="mouvement(-1)">
− VENTE
</button>
</div>

<div class="box">

<input id="recherche"
placeholder="🔎 Rechercher produit, taille ou code..."
oninput="afficher()">

<button class="export" onclick="exportCSV()">
Exporter CSV
</button>

<button class="catalogue" onclick="exportCatalogue()">
📄 Créer catalogue HTML
</button>

<button class="effacer" onclick="toutEffacer()">
Effacer le stock
</button>

</div>

<table>
<thead>
<tr>
<th>Code</th>
<th>Produit</th>
<th>Taille</th>
<th>Stock</th>
</tr>
</thead>
<tbody id="liste"></tbody>
</table>

<script>

let stock=JSON.parse(
 localStorage.getItem("stockIndienV3") ||
 localStorage.getItem("stockIndienV2") ||
 "{}"
);

let photoProduit="";
let scanner=null;
let scanBloque=false;

function chargerPhoto(event){
 const fichier=event.target.files[0];
 if(!fichier)return;

 const lecteur=new FileReader();

 lecteur.onload=function(e){
   photoProduit=e.target.result;
   const img=document.getElementById("apercuPhoto");
   img.src=photoProduit;
   img.style.display="block";
 };
 lecteur.readAsDataURL(fichier);
}

function nettoyerCode(texte){
 return texte.trim().toUpperCase()
 .replace(/\s+/g,"-")
 .replace(/[^A-Z0-9\-]/g,"");
}

function creerProduit(){

 const nom=document.getElementById("nouveauNom").value.trim();
 let reference=nettoyerCode(
   document.getElementById("reference").value
 );
 const couleur=document.getElementById("couleur").value.trim();

 if(!nom){
   alert("Indiquez le nom du produit.");
   return;
 }

 if(!reference){
   reference="IB-"+Date.now().toString().slice(-8);
   document.getElementById("reference").value=reference;
 }

 const tailles=[...document.querySelectorAll(
   ".tailles input:checked"
 )].map(x=>x.value);

 if(!tailles.length){
   alert("Sélectionnez au moins une taille.");
   return;
 }

 const zone=document.getElementById("etiquettes");
 zone.innerHTML="";

 tailles.forEach((taille,index)=>{

   const code=reference+"-"+taille;

   if(!stock[code]){
     stock[code]={
       nom:nom,
       taille:taille,
       couleur:couleur,
       quantite:0,
       photo:photoProduit
     };
   }else{
     stock[code].nom=nom;
     stock[code].taille=taille;
     stock[code].couleur=couleur;
     if(photoProduit) stock[code].photo=photoProduit;
   }

   const div=document.createElement("div");
   div.className="etiquette";

   div.innerHTML=
     (photoProduit ?
       '<img src="'+photoProduit+'"><br>' : '')+
     "<b>"+nom+"</b><br>"+
     (couleur ? couleur+" · " : "")+
     "<b>"+taille+"</b><br>"+
     '<svg id="bar'+index+'"></svg>'+
     "<br><small>"+code+"</small>";

   zone.appendChild(div);

   setTimeout(()=>{
     JsBarcode("#bar"+index,code,{
       format:"CODE128",
       displayValue:false,
       height:45,
       margin:3
     });
   },0);
 });

 sauvegarder();
 afficher();
}

function sauvegarder(){
 localStorage.setItem(
   "stockIndienV3",
   JSON.stringify(stock)
 );
}

function mouvement(qte){

 const code=document.getElementById("code")
 .value.trim().toUpperCase();

 const nom=document.getElementById("nom").value.trim();
 const taille=document.getElementById("taille").value.trim();

 if(!code){
   alert("Scannez ou saisissez un code-barres.");
   return;
 }

 if(!stock[code]){
   if(qte<0){
     alert("Produit inconnu.");
     return;
   }

   if(!nom){
     alert("Produit inconnu : indiquez son nom.");
     return;
   }

   stock[code]={
     nom:nom,
     taille:taille,
     couleur:"",
     quantite:0,
     photo:""
   };
 }

 stock[code].quantite+=qte;

 if(stock[code].quantite<0)
   stock[code].quantite=0;

 sauvegarder();
 afficher();

 document.getElementById("messageScan").textContent=
   stock[code].nom+" · "+stock[code].taille+
   " → stock : "+stock[code].quantite;

 document.getElementById("code").value="";
 document.getElementById("nom").value="";
 document.getElementById("taille").value="";
}

function demarrerScanner(){

 const zone=document.getElementById("reader");
 zone.style.display="block";

 if(scanner){
   try{scanner.clear();}catch(e){}
 }

 scanner=new Html5QrcodeScanner(
   "reader",
   {
     fps:10,
     qrbox:{width:280,height:160},
     rememberLastUsedCamera:false
   },
   { facingMode: "environment" }
 );

 scanner.render(
   function(code){
     if(scanBloque)return;
     scanBloque=true;

     code=code.trim().toUpperCase();

     document.getElementById("code").value=code;

     if(stock[code]){
       document.getElementById("nom").value=stock[code].nom;
       document.getElementById("taille").value=stock[code].taille;

       stock[code].quantite++;
       sauvegarder();
       afficher();

       document.getElementById("messageScan").textContent=
         "✅ "+stock[code].nom+" · "+
         stock[code].taille+
         " → stock : "+stock[code].quantite;

       if(navigator.vibrate) navigator.vibrate(120);

       setTimeout(()=>{
         scanBloque=false;
       },1200);

     }else{
       document.getElementById("messageScan").textContent=
         "⚠️ Code inconnu : "+code;

       setTimeout(()=>{
         scanBloque=false;
       },1500);
     }
   },
   function(){}
 );
}

function afficher(){

 const recherche=document.getElementById("recherche")
 .value.toLowerCase();

 const liste=document.getElementById("liste");
 liste.innerHTML="";

 Object.keys(stock)
 .sort((a,b)=>
   (stock[a].nom||"").localeCompare(stock[b].nom||"")
 )
 .forEach(code=>{

   const p=stock[code];

   const texte=(
     code+" "+(p.nom||"")+" "+(p.taille||"")
   ).toLowerCase();

   if(!texte.includes(recherche))return;

   const tr=document.createElement("tr");

   tr.innerHTML=
     "<td>"+code+"</td>"+
     "<td>"+(p.nom||"")+"</td>"+
     "<td>"+(p.taille||"")+"</td>"+
     "<td class='stock'>"+(p.quantite||0)+"</td>";

   liste.appendChild(tr);
 });
}

function exportCSV(){

 let csv="Code;Produit;Taille;Stock\n";

 Object.keys(stock).forEach(code=>{
   const p=stock[code];

   csv+=
     code+";"+
     (p.nom||"")+";"+
     (p.taille||"")+";"+
     (p.quantite||0)+"\n";
 });

 telecharger(
   "\uFEFF"+csv,
   "stock-indien-V3.csv",
   "text/csv;charset=utf-8"
 );
}

function exportCatalogue(){

 const groupes={};

 Object.keys(stock).forEach(code=>{
   const p=stock[code];

   const base=code.replace(
     /-(XS|S|M|L|XL|2XL|3XL|4XL|5XL)$/,""
   );

   if(!groupes[base]){
     groupes[base]={
       nom:p.nom||"",
       couleur:p.couleur||"",
       photo:p.photo||"",
       tailles:[]
     };
   }

   groupes[base].tailles.push({
     taille:p.taille||"",
     stock:p.quantite||0,
     code:code
   });
 });

 let cartes="";

 Object.keys(groupes).sort().forEach(ref=>{

   const p=groupes[ref];

   let tailles=p.tailles.map(t=>
     "<tr>"+
     "<td>"+t.taille+"</td>"+
     "<td>"+t.stock+"</td>"+
     "<td>"+t.code+"</td>"+
     "</tr>"
   ).join("");

   cartes+=`
   <div class="produit">
     ${p.photo ?
       `<img src="${p.photo}">` : ""}
     <div class="infos">
       <h2>${p.nom}</h2>
       <p><b>Référence :</b> ${ref}</p>
       ${p.couleur ?
         `<p><b>Couleur :</b> ${p.couleur}</p>` : ""}
       <table>
         <tr><th>Taille</th><th>Stock</th><th>Code</th></tr>
         ${tailles}
       </table>
     </div>
   </div>`;
 });

 const html=`<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catalogue Stock Indien Boutique</title>
<style>
body{
 font-family:Arial,sans-serif;
 margin:30px;
 background:#eee;
}
h1{text-align:center}
.produit{
 display:flex;
 gap:25px;
 background:white;
 margin:18px auto;
 padding:20px;
 max-width:900px;
 border-radius:12px;
}
.produit img{
 width:180px;
 height:180px;
 object-fit:contain;
}
.infos{flex:1}
table{
 width:100%;
 border-collapse:collapse;
}
th,td{
 padding:8px;
 border-bottom:1px solid #ddd;
 text-align:left;
}
@media(max-width:600px){
 .produit{display:block}
 .produit img{
   width:100%;
   height:220px;
 }
}
</style>
</head>
<body>
<h1>Stock Indien Boutique</h1>
${cartes}
</body>
</html>`;

 telecharger(
   html,
   "catalogue-stock-indien.html",
   "text/html;charset=utf-8"
 );
}

function telecharger(contenu,nom,type){

 const blob=new Blob([contenu],{type:type});
 const url=URL.createObjectURL(blob);

 const lien=document.createElement("a");
 lien.href=url;
 lien.download=nom;

 document.body.appendChild(lien);
 lien.click();
 lien.remove();

 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function toutEffacer(){

 if(confirm("Effacer tout le stock V3 ?")){
   stock={};
   sauvegarder();
   afficher();
 }
}

document.getElementById("code")
.addEventListener("keydown",function(e){
 if(e.key==="Enter"){
   e.preventDefault();
   mouvement(1);
 }
});

sauvegarder();
afficher();

</script>
</body>
</html>
